publish_to: none
version: 1.1.0+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^3.0.0
  intl: any
  package_info_plus: ^8.3.1
  timezone: ^0.11.1
